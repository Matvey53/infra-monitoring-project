
name: CI - Infrastructure Monitoring

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/monitoring

jobs:
  test:
    name: Bash Scripts Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh

      - name: Test API monitoring - HTTP 200
        run: |
          bash check_api.sh https://httpbin.org/status/200


